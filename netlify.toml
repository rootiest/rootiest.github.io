# Temporary: Netlify serves rootiest.com until the move to the Rootiest edges.
# Publish only site/, never the repository root. Delete this file at the cutover.
[build]
  # The site is prebuilt in site/. This replaces any build command set in the
  # Netlify UI (the old site was built with Jekyll).
  command = "echo site/ is prebuilt"
  publish = "site"

# The privacy notices are published by the privacy repository; after the cutover
# Caddy serves them at /privacy/ directly.
[[redirects]]
  from = "/privacy/*"
  to = "https://pages.rootiest.fyi/privacy/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/privacy"
  to = "https://pages.rootiest.fyi/privacy/"
  status = 302
  force = true

[[redirects]]
  from = "/discord"
  to = "https://discord.gg/48dqz7gwVX"
  status = 302
