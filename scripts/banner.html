<!DOCTYPE html>
<!--
  Source for img/banner.png, the 1200x630 social preview image (og:image).
  Render it from the repo root with:  python3 scripts/render-banner.py
  Always Catppuccin Mocha: preview images can't follow the viewer's light/dark mode.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rootiest banner</title>
  <style>
    :root {
      --brand: #ff004c;
      --base: #1e1e2e;
      --mantle: #181825;
      --crust: #11111b;
      --surface0: #313244;
      --text: #cdd6f4;
      --subtext: #bac2de;
      --muted: #7f849c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      gap: 64px;
      padding: 0 88px;
      /* Glows come from banner-bg.png (dithered, so no banding); see scripts/banner-bg.py */
      background: url("banner-bg.png") var(--base);
      color: var(--text);
      font-family: "Noto Sans", system-ui, sans-serif;
    }

    /* Faint dot grid */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgb(205 214 244 / 7%) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      mask-image: linear-gradient(90deg, transparent 0%, #000 45%, #000 100%);
    }

    .logo,
    .copy,
    .url {
      z-index: 1;
    }

    .logo {
      position: relative;
      flex: none;
      width: 340px;
      height: 340px;
    }

    .copy {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    h1 {
      font-size: 92px;
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -0.035em;
    }

    h1 span {
      display: block;
      color: var(--brand);
    }

    p {
      max-width: 560px;
      color: var(--subtext);
      font-size: 29px;
      line-height: 1.35;
    }

    .tiles {
      display: flex;
      gap: 14px;
      margin-top: 6px;
    }

    .tile {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--hue) 16%, var(--base));
      box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--hue) 30%, transparent);
      color: var(--hue);
    }

    .tile svg {
      width: 28px;
      height: 28px;
    }

    .url {
      position: absolute;
      right: 88px;
      bottom: 48px;
      color: var(--muted);
      font-family: "Iosevka Nerd Font", "Iosevka", ui-monospace, monospace;
      font-size: 26px;
      letter-spacing: 0.02em;
    }

    .url b {
      color: var(--brand);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <img class="logo" src="../img/icons/logo.svg" alt="" />
  <div class="copy">
    <h1>Rootiest <span>Solutions</span></h1>
    <p>Self-hosted, privacy-respecting services and open-source tools.</p>
    <div class="tiles" aria-hidden="true">
      <span class="tile" style="--hue: #f38ba8"><svg><use href="../assets/icons.svg#fingerprint"></use></svg></span>
      <span class="tile" style="--hue: #f9e2af"><svg><use href="../assets/icons.svg#notebook-pen"></use></svg></span>
      <span class="tile" style="--hue: #89b4fa"><svg><use href="../assets/icons.svg#image"></use></svg></span>
      <span class="tile" style="--hue: #a6e3a1"><svg><use href="../assets/icons.svg#git-branch"></use></svg></span>
      <span class="tile" style="--hue: #cba6f7"><svg><use href="../assets/icons.svg#lock-keyhole"></use></svg></span>
      <span class="tile" style="--hue: #fab387"><svg><use href="../assets/icons.svg#square-terminal"></use></svg></span>
    </div>
  </div>
  <div class="url"><b>›</b> rootiest.com</div>
</body>
</html>
